# Keeps GitHub Actions references current in this repo's own workflows
# (checkout, upload-pages-artifact, peter-evans/create-pull-request, etc.).
#
# Note: this does not, by itself, help the four project repos that pin
# notify-portfolio.yml to a commit SHA on this repo (see that workflow's
# comment). Dependabot's github-actions updater tracks tagged releases on
# the referenced repository; this repo has none yet, so there is nothing
# for their pins to "update to" until it starts tagging releases. Until
# then, re-pinning those four callers after a change here is still manual.
#
# Scoped to github-actions only: this file does not opt this repository
# into Dependabot updates for any other ecosystem (e.g. npm).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
