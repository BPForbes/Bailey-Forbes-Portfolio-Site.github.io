name: Typecheck

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Compile TypeScript
        run: npm ci && npm run build
